[project]
name = "quantlab"
version = "0.1.0"
description = "个人量化研究：本地行情库、回测与每日信号"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "numpy>=2", "pyarrow>=17", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quant = "quantlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantlab*"]
